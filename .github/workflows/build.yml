name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild -project DuoqingDays.xcodeproj \
            -scheme DuoqingDays \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/DuoqingDays.app" Payload/
          zip -r DuoqingDays.ipa Payload
          ls -lh DuoqingDays.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuoqingDays-ipa
          path: DuoqingDays.ipa

      - name: Publish release with IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 多情倒数日 IPA build-${{ github.run_number }}
          files: DuoqingDays.ipa
